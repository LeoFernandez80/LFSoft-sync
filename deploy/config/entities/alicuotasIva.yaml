# Alicuotas de IVA (Articulo.mdb, Alicuotas) <-> articulos."alicuotasIva".
# PK directa: alicuotaIva_id = AlicIva_Codigo (codigos por /sync/next-id/alicuotas).
entity: alicuotas
enabled: true
load_order: 10

access:
  mdb: Articulo.mdb
  table: Alicuotas
  pk: AlicIva_Codigo
  pk_type: byte

postgres:
  schema: articulos
  table: alicuotasIva
  pk: alicuotaIva_id

detection:
  access_to_pg: max_pk
  pg_to_access: trigger
  full_scan_interval: 30m
  change_scan_interval: 30s

fields:
  - access: AlicIva_Codigo
    pg: alicuotaIva_id
    type: int

  - access: AlicIva_Descripcion
    pg: alicuotaIva_descripcion
    type: string
    transform: trim

  - access: AlicIva_Tasa
    pg: alicuotaIva_tasa
    type: decimal

sync:
  interval: 10s
  batch_size: 50
  direction: both
