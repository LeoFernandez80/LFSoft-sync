# Clientes (Clientes.mdb) <-> sales.customers, con sus subclientes, jurisdicciones de IIBB y
# contactos (con sus horarios de atencion).
#
# Clave: Cliente_Codigo = customer_legacyCode. Los clientes dados de alta en la app no tienen
# codigo legacy: quedan solo en PG (el worker PG -> Access los saltea).
# PG -> Access escribe el documento entero (cabecera y colecciones), solo las columnas
# mapeadas. Los clientes creados en la app reciben codigo legacy (MAX + 1, generate_key) y los
# contactos nuevos Id_Contacto (MAX + 1 de la tabla).
# Mapeo tomado de LFSoft-app/database/sales/migrations/V021__seed_customers y de
# PSB Hidramic (Modulo Clientes.bas / Modulo Subclientes.bas).
#
# Sin mapear (quedan en Access): Cliente_Actualizado, Cliente_PagoProveedoresBanco (no hay
# catalogo de bancos sembrado en PG) y el pais/localidad de los bloques administrativo y de
# entrega intermedia del subcliente (el legacy tiene un solo Pais_Codigo).
entity: customers
enabled: true
load_order: 40

access:
  mdb: Clientes.mdb
  table: Clientes
  pk: Cliente_Codigo
  pk_type: long

postgres:
  schema: sales
  table: customers
  pk: customer_id
  business_key: customer_legacyCode

detection:
  access_to_pg: timestamp
  timestamp_column: Cliente_FechaActualizado
  timestamp_time_column: Cliente_HoraActualizado
  pg_to_access: trigger
  # Lee subclientes y jurisdicciones de los ~2.400 clientes: es barato.
  full_scan_interval: 15m
  change_scan_interval: 1m

fields:
  - access: Cliente_Codigo
    pg: customer_legacyCode
    type: int

  - access: Cliente_RazonSocial
    pg: customer_businessName
    type: string
    transform: trim

  - access: Cliente_Activo
    pg: customer_isActive
    type: access_bool

  - access: Cliente_Direccion
    pg: customer_address
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Cliente_CUIT
    pg: customer_taxId
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Cliente_IDImpositivo
    pg: customer_taxIdAlternative
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Pais_Codigo
    pg: customer_country_id
    type: int
    nullable: true
    null_sentinels: ["0"]
    lookup:
      table: utilities.countries
      match: country_legacyCode
      select: country_id

  # "ND" es el centinela legacy de "sin codigo postal"; se escribe de vuelta como "ND".
  - access: Codigo_Postal
    pg: customer_postalCode
    type: string
    nullable: true
    null_sentinels: ["ND", "", " "]
    transform: trim

  # La localidad se resuelve por (codigo postal, pais), igual que el seed.
  - access: Codigo_Postal
    pg: customer_locality_id
    type: string
    nullable: true
    null_sentinels: ["ND", "", " "]
    lookup:
      query: >-
        SELECT l."locality_id" FROM utilities."localities" l
        JOIN utilities."countries" c ON c."country_id" = l."locality_country_id"
        WHERE l."locality_postalCode" = $1 AND c."country_legacyCode" = $2::int
      args: [Codigo_Postal, Pais_Codigo]

  - access: Cliente_Telefono
    pg: customer_phone
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Telefono1
    pg: customer_phone1
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Telefono2
    pg: customer_phone2
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Telefono3
    pg: customer_phone3
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Telefono4
    pg: customer_phone4
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Telefono5
    pg: customer_phone5
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Fax
    pg: customer_fax
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Fax1
    pg: customer_fax1
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Fax2
    pg: customer_fax2
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Fax3
