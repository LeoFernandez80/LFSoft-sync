  # ------------------------------------------------- Jurisdicciones de Convenio Multilateral
  - entity: customerTaxJurisdictions
    access:
      table: Jurisdicciones de IIBB
      pk: Provincia_CodigoCM
      parent_fk: Cliente_Codigo
    postgres:
      table: customerTaxJurisdictions
      pk: customerTaxJurisdiction_id
      parent_fk: customerTaxJurisdiction_customer_id
      # UQ_CustomerTaxJurisdictions_customer_cmCode (LFSoft-app sales V026).
      conflict: [customerTaxJurisdiction_customer_id, customerTaxJurisdiction_cmCode]
      delete_missing: true
    fields:
      - access: Provincia_CodigoCM
        pg: customerTaxJurisdiction_cmCode
        type: int

      - access: Provincia_CodigoCM
        pg: customerTaxJurisdiction_province_id
        type: int
        lookup:
          table: utilities.provinces
          match: province_cmCode
          select: province_id


  # ------------------------------------------------------------------ Contactos
  # La clave en Clientes.mdb es (cliente, Id_Contacto): el legacy copia contactos de un
  # cliente a otro conservando el Id_Contacto (38 casos, clientes 612/2254 y 910/2259).
  # Por eso son una coleccion del cliente y no una entidad propia.
  # No se borran en PG los que faltan en Access: la app tambien crea contactos.
  - entity: contacts
    access:
      table: Contactos
      pk: Id_Contacto
      parent_fk: cliente
      # El legacy numera Id_Contacto sobre toda la tabla.
      generate_key: global
    postgres:
      table: contacts
      pk: contact_id
      parent_fk: contact_customer_id
      # UQ_Contacts_customer_legacyCode (LFSoft-app sales V026).
      conflict: [contact_customer_id, contact_legacyCode]
      delete_missing: false
    fields:
      - access: Id_Contacto
        pg: contact_legacyCode
        type: int

      # El destino es el par (cliente, codigo de subcliente). 0 = sin asignar.
      - access: SubCliente_Codigo
        pg: contact_subClient_id
        type: int
        nullable: true
        null_sentinels: ["0"]
        lookup:
          query: >-
            SELECT s."subClient_id" FROM sales."subClients" s
            JOIN sales."customers" c ON c."customer_id" = s."subClient_customer_id"
            WHERE c."customer_legacyCode" = $1::int AND s."subClient_code" = $2::int
          args: [cliente, SubCliente_Codigo]
          reverse_query: >-
            SELECT s."subClient_code" FROM sales."subClients" s WHERE s."subClient_id" = $1

      # Texto SI/NO en el legacy.
      - access: activo
        pg: contact_isActive
        type: access_bool
        map: {"SI": true, "NO": false, "": false}

      - access: caracter
        pg: contact_title
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: apellido
        pg: contact_lastName
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: nombre
        pg: contact_firstName
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: telefono
        pg: contact_phone
        type: string
        nullable: true
        null_sentinels: ["", " "]

      - access: TelefonoTrabajoInterno
        pg: contact_workExtension
        type: string
        nullable: true
        null_sentinels: ["", " "]

      - access: TelefonoTrabajoDirecto
        pg: contact_workDirectPhone
        type: string
        nullable: true
        null_sentinels: ["", " "]

      - access: TelefonoTrabajoFAXDirecto
        pg: contact_workDirectFax
        type: string
        nullable: true
        null_sentinels: ["", " "]

      - access: direccion
        pg: contact_address
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: localidad
        pg: contact_locality
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: e_mail
        pg: contact_email
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: cargo
        pg: contact_position
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: SeccionPrincipal
        pg: contact_primarySection_id
        type: int
        nullable: true
        null_sentinels: ["0"]
        lookup:
          table: utilities.contactSections
          match: contactSection_legacyCode
          select: contactSection_id

      - access: SeccionSecundaria
        pg: contact_secondarySection_id
        type: int
        nullable: true
        null_sentinels: ["0"]
        lookup:
          table: utilities.contactSections
          match: contactSection_legacyCode
          select: contactSection_id

      # Seccion en texto libre, anterior a SeccionPrincipal/SeccionSecundaria.
      - access: seccion
        pg: contact_legacySectionText
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: Observaciones
        pg: contact_observation
        type: string
        nullable: true
        null_sentinels: ["", " "]

      # 1/0 numerico en el legacy, no booleano Jet.
      - access: ResponsablePagos
        pg: contact_isPaymentResponsible
        type: int_bool

      - access: Preferencias
        pg: contact_preferences
        type: string
        nullable: true
        null_sentinels: ["", " "]

      - access: Hobby
        pg: contact_hobby
        type: string
        nullable: true
        null_sentinels: ["", " "]

      - access: ClubFutbol
        pg: contact_footballClub
        type: string
        nullable: true
        null_sentinels: ["", " "]

      # Texto "dd/mm"; la mascara vacia "__/__" queda NULL.
      - access: FechaCumpleaños
        pg: contact_birthDay
        type: int
        nullable: true
        split: {sep: "/", index: 0}
        # PG -> Access: vuelve a armar "dd/mm"; sin dia o mes, la mascara vacia del legacy.
        reverse_from: [contact_birthDay, contact_birthMonth]
        reverse_format: "%02d/%02d"
        reverse_empty: "__/__"

      - access: FechaCumpleaños
        pg: contact_birthMonth
        type: int
        nullable: true
        split: {sep: "/", index: 1}

      - access: ObservacionesPersonales
        pg: contact_personalObservation
        type: string
        nullable: true
        null_sentinels: ["", " "]

    children:
      # Horarios: sin clave en Access; se identifican por (cliente, contacto, dia).
      - entity: contactSchedules
        access:
          table: Horarios Atencion de Contactos
          pk: Horario_Dia
          parent_fk: Id_Contacto
          root_fk: Cliente_Codigo
        postgres:
          table: contactSchedules
          pk: contactSchedule_id
          parent_fk: contactSchedule_contact_id
          conflict: [contactSchedule_contact_id, contactSchedule_dayCode]
          delete_missing: true
        fields:
          # Mismo catalogo que el seed (sales V018): numeracion contigua 1..9.
          - access: Horario_Dia
            pg: contactSchedule_dayCode
            type: int
            map: &dias
              "Lunes-Miercoles-Viernes": 1
              "Lunes-Miércoles-Viernes": 1
              "Martes-Jueves": 2
              "Lunes a Viernes": 3
              "Lunes": 4
              "Martes": 5
              "Miercoles": 6
              "Miércoles": 6
              "Jueves": 7
              "Viernes": 8
              "Sabado": 9
              "Sábado": 9

          - access: Horario_Dia
            pg: contactSchedule_dayOrder
            type: int
            map: *dias

          - access: Horario_Horarios
            pg: contactSchedule_freeText
            type: string
            nullable: true
            null_sentinels: ["", " "]


sync:
  interval: 3s
  batch_size: 100
  direction: both
  generate_key: true
