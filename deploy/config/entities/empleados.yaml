# Empleados (Utilidades.mdb) <-> utilities.employees. PK directa: employee_id = Empleado_Codigo
# (utilities V024 la deja GENERATED BY DEFAULT), como la ETL original: las planillas de rendicion
# del legacy referencian responsable y asistentes por ese codigo.
#
# Ida y vuelta. Las altas de la app toman employee_id de la identity, que bump_sequence mantiene
# por encima del MAX del legacy, y llegan a Access en segundos con ese mismo codigo (el MAX+1 del
# VB6 ya las ve).
#
# El legacy guarda el nombre completo en una sola columna (Empleado_Nombre) y la app lo separa en
# nombre y apellido con la misma heuristica que la ETL (ultima palabra mas sus particulas: "de la
# Torre"); al escribir en Access se vuelve a unir (reverse_from).
# Sin mapear (quedan en Access): Empleado_Apellido (vacio en todos), Empleado_Foto,
# EmpresaArea_Codigo.
entity: employees
enabled: true
load_order: 60

access:
  mdb: Utilidades.mdb
  table: Empleados
  pk: Empleado_Codigo
  pk_type: long

postgres:
  schema: utilities
  table: employees
  pk: employee_id

detection:
  access_to_pg: max_pk
  pg_to_access: trigger
  full_scan_interval: 60m
  change_scan_interval: 1m

fields:
  - access: Empleado_Codigo
    pg: employee_id
    type: int

  - access: Empleado_DNI
    pg: employee_dni
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Empleado_Iniciales
    pg: employee_initials
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Empleado_Nombre
    pg: employee_firstName
    type: string
    transform: first_name
    reverse_from: [employee_firstName, employee_lastName]

  - access: Empleado_Nombre
    pg: employee_lastName
    type: string
    transform: last_name

  - access: Empleado_Domicilio
    pg: employee_address
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Empleado_Telefono
    pg: employee_phone
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Empleado_Celular
    pg: employee_mobile
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Empleado_CelularTrabajo
    pg: employee_workMobile
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Empleado_CorreoPersonal
    pg: employee_personalEmail
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  # Jet guarda "sin fecha" como 1899-12-30.
  - access: Empleado_FechaVinculacion
    pg: employee_hireDate
    type: date
    nullable: true
    null_before: "1900-01-01"

  - access: Empleado_FechaDesvinculacion
    pg: employee_terminationDate
    type: date
    nullable: true
    null_before: "1900-01-01"

  - access: Empleado_FechaNacimiento
    pg: employee_birthDate
    type: date
    nullable: true
    null_before: "1900-01-01"

  # Empleado_Vinculado es un codigo 1/2, no un booleano: 1 = vinculado (activo), 2 = de baja.
  # Cualquier otro valor cuenta como inactivo, como en la ETL.
  - access: Empleado_Vinculado
    pg: employee_isActive
    type: access_bool
    map:
      "1": true
      "2": false
      "0": false

sync:
  interval: 30s
  batch_size: 100
  direction: both
  # Una baja en el VB6 no borra en PG: un alta de la app que todavia no llego a Access se perderia.
  delete_missing: false
  bump_sequence: employee_id
