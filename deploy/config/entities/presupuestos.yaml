            type: string
            nullable: true
            null_sentinels: ["", " "]
            transform: trim

          - access: Usuario_Usr
            pg: quoteItemRealDetail_user
            type: string
            nullable: true
            null_sentinels: ["", " "]
            transform: trim

      # ---------------------------------------------- Reales_Otros (fuera de stock reales)
      - entity: quoteItemRealOthers
        access:
          table: Reales_Otros
          pk: SubItem_Numero
          parent_fk: Item_Numero
          root_fk: Presupuesto_Numero
        postgres:
          table: quoteItemRealOthers
          pk: quoteItemRealOther_id
          parent_fk: quoteItemRealOther_quoteItem_id
          conflict: [quoteItemRealOther_quoteItem_id, quoteItemRealOther_lineNumber]
          delete_missing: true
        fields:
          - access: SubItem_Numero
            pg: quoteItemRealOther_lineNumber
            type: int

          - access: Item_Detalle
            pg: quoteItemRealOther_description
            type: string
            transform: trim

          - access: Item_DetalleExtra
            pg: quoteItemRealOther_extraDetail
            type: string
            nullable: true
            null_sentinels: ["", " "]
            transform: trim

          - access: Item_Cantidad
            pg: quoteItemRealOther_quantity
            type: decimal

          - access: Item_Cantidad_Total
            pg: quoteItemRealOther_totalQuantity
            type: decimal

          - access: Item_Precio
            pg: quoteItemRealOther_unitPrice
            type: decimal

          - access: Item_Costo
            pg: quoteItemRealOther_unitCost
            type: decimal

          - access: Item_PrecioLista
            pg: quoteItemRealOther_listPrice
            type: decimal

          - access: Item_Descuento
            pg: quoteItemRealOther_discount
            type: decimal

          - access: Item_TipoDescuento
            pg: quoteItemRealOther_discountType
            type: int
            nullable: true

          - access: Item_Bonif
            pg: quoteItemRealOther_bonus
            type: decimal

          - access: Item_Factor
            pg: quoteItemRealOther_factor
            type: decimal

          - access: Item_FactorImp
            pg: quoteItemRealOther_taxFactor
            type: decimal

          - access: Item_Moneda
            pg: quoteItemRealOther_currency
            type: int
            nullable: true

          - access: Item_PrecioControlado
            pg: quoteItemRealOther_isPriceControlled
            type: int_bool

          - access: Usuario_Usr
            pg: quoteItemRealOther_user
            type: string
            nullable: true
            null_sentinels: ["", " "]
            transform: trim

      # ---------------------------------------------- Movimientos (retiros de stock)
      # Saldo NETO retirado por (presupuesto, item, articulo): los retiros (52/59)
      # suman y las devoluciones (2) restan (PresupStock.bas). Tabla PG nueva:
      # LFSoft-app sales V025 (deploy/migrations-app/V029).
      - entity: quoteItemWithdrawals
        # Ida y vuelta. Al escribir en Access, las filas repetidas del mismo articulo se
        # reemplazan por la sumada (sum_on_duplicate) y no se borran retiros que falten en PG
        # (access_delete_missing: false): pueden ser del VB6 y todavia no haber llegado.
        access:
          table: Movimientos
          pk: Articulo_Codigo
          parent_fk: Item_Numero
          root_fk: Presupuesto_Numero
        postgres:
          table: quoteItemWithdrawals
          pk: quoteItemWithdrawal_id
          parent_fk: quoteItemWithdrawal_quoteItem_id
          conflict: [quoteItemWithdrawal_quoteItem_id, quoteItemWithdrawal_articleCode]
          # Movimientos no tiene clave en Access: el mismo articulo puede repetirse en un item
          # (o con otra mayuscula). Las cantidades se suman, que es lo que significan.
          sum_on_duplicate: [quoteItemWithdrawal_quantity]
          delete_missing: true
          access_delete_missing: false
        fields:
          - access: Articulo_Codigo
            pg: quoteItemWithdrawal_articleCode
            type: string
            transform: trim

          # Nullable: el legacy acepta codigos que no estan en el maestro.
          - access: Articulo_Codigo
            pg: quoteItemWithdrawal_article_id
            type: string
            transform: trim
            nullable: true
            lookup:
              table: articulos.articulos
              match: articulo_codigo
              select: articulo_id
              case_insensitive: true

          - access: Articulo_Cantidad
            pg: quoteItemWithdrawal_quantity
            type: decimal

          - access: Articulo_Precio
            pg: quoteItemWithdrawal_unitPrice
            type: decimal

          - access: Articulo_Costo
            pg: quoteItemWithdrawal_unitCost
            type: decimal

sync:
  interval: 3s
  batch_size: 20
  direction: both
  # Los presupuestos que la app creo antes del sync PG -> Access no estan en Access: no
  # borrarlos de PG por faltar alla.
  delete_missing: false
  # GET /sync/next-id/quotes devuelve MAX(Presupuesto_Numero, quote_number) + 1; lo usa
  # el backend de LFSoft-app para numerar (quotes.WithNumbering, reintenta +1 si choca).
  # Con business_key el endpoint lo rechazaria sin esta opcion.
  use_idcoord: true
