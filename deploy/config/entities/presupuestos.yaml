children:
  # ------------------------------------------------------------------ Items
  - entity: quoteItems
    access:
      table: Items
      pk: Item_Numero
      parent_fk: Presupuesto_Numero
    postgres:
      table: quoteItems
      pk: quoteItem_id
      parent_fk: quoteItem_quote_id
      conflict: [quoteItem_quote_id, quoteItem_number]
      delete_missing: true
    fields:
      - access: Item_Numero
        pg: quoteItem_number
        type: int

      - access: Item_Descripcion
        pg: quoteItem_description
        type: string
        transform: trim

      - access: Item_DescripcionRTF
        pg: quoteItem_descriptionRtf
        type: string
        nullable: true
        null_sentinels: ["", " "]

      - access: Actividad_Codigo
        pg: quoteItem_activityCode
        type: string
        transform: trim

      - access: Actividad_Codigo
        pg: quoteItem_actividad_id
        type: string
        transform: trim
        nullable: true
        lookup:
          table: articulos.actividades
          match: actividad_codigo
          select: actividad_id

      - access: Actividad_Codigo
        pg: quoteItem_activityName
        type: string
        nullable: true
        lookup:
          table: articulos.actividades
          match: actividad_codigo
          select: actividad_descripcion

      - access: Item_Cantidad
        pg: quoteItem_quantity
        type: decimal

      - access: Item_Precio
        pg: quoteItem_price
        type: decimal

      - access: Item_Costo
        pg: quoteItem_cost
        type: decimal

      - access: Item_PrecioReal
        pg: quoteItem_realPrice
        type: decimal

      - access: Item_CantConfirmada
        pg: quoteItem_confirmedQuantity
        type: decimal

      - access: Item_CantEntregada
        pg: quoteItem_deliveredQuantity
        type: decimal

      - access: Item_CantFacturada
        pg: quoteItem_invoicedQuantity
        type: decimal

      - access: Item_CantRetirada
        pg: quoteItem_withdrawnQuantity
        type: decimal

      - access: Item_Facturado
        pg: quoteItem_isInvoiced
        type: access_bool

      - access: Item_Toma
        pg: quoteItem_isTaken
        type: access_bool

      - access: Item_CtaContable
        pg: quoteItem_accountingAccount
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: Item_OC
        pg: quoteItem_purchaseOrder
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: Item_OCFecha
        pg: quoteItem_purchaseOrderDate
        type: date
        nullable: true

      - access: Item_OCOpcion
        pg: quoteItem_purchaseOrderOption
        type: int
        nullable: true

      - access: Item_TipoMonedaOC
        pg: quoteItem_purchaseOrderCurrencyType
        type: int
        nullable: true

      - access: Item_PlazoCant
        pg: quoteItem_deliveryTermAmount
        type: decimal

      - access: Item_PlazoTipo
        pg: quoteItem_deliveryTermType
        type: int
        nullable: true

      - access: Item_PlazoOtro
        pg: quoteItem_deliveryTermOther
        type: string
        nullable: true
        null_sentinels: ["", " "]
        transform: trim

      - access: Item_ProcedimientoTecnico
        pg: quoteItem_technicalProcedure
        type: int
        nullable: true

      - access: Item_InformeTecnico
        pg: quoteItem_technicalReport
        type: int
        nullable: true

      - access: Item_InformeTecnicoAnterior
        pg: quoteItem_previousTechnicalReport
        type: int
        nullable: true

      - access: Item_InformeTecnicoUnico
        pg: quoteItem_hasSingleTechnicalReport
        type: access_bool

      - access: Procedimiento_Numero
        pg: quoteItem_procedureNumber
        type: int
        nullable: true
        null_sentinels: ["0"]

      - access: Procedimiento_Version
        pg: quoteItem_procedureVersion
        type: int
        nullable: true

      - access: Procedimiento_Tipo
        pg: quoteItem_procedureType
        type: int
        nullable: true

    children:
      # ---------------------------------------------- Detalles (articulos estimados)
      - entity: quoteItemDetails
        access:
          table: Detalles
          pk: SubItem_Numero
          parent_fk: Item_Numero
          root_fk: Presupuesto_Numero
        postgres:
          table: quoteItemDetails
          pk: quoteItemDetail_id
          parent_fk: quoteItemDetail_quoteItem_id
          conflict: [quoteItemDetail_quoteItem_id, quoteItemDetail_lineNumber]
          delete_missing: true
        fields:
          - access: SubItem_Numero
            pg: quoteItemDetail_lineNumber
            type: int

          - access: Articulo_Codigo
            pg: quoteItemDetail_articleCode
            type: string
            transform: trim

          # Jet compara codigos sin distinguir mayusculas: el lookup tambien.
          - access: Articulo_Codigo
            pg: quoteItemDetail_article_id
            type: string
            transform: trim
            lookup:
              table: articulos.articulos
              match: articulo_codigo
              select: articulo_id
              case_insensitive: true

          - access: Articulo_Codigo
            pg: quoteItemDetail_description
            type: string
            lookup:
              table: articulos.articulos
              match: articulo_codigo
              select: articulo_descripcion
              case_insensitive: true

          - access: Articulo_Detalle
            pg: quoteItemDetail_extraDetail
            type: string
            nullable: true
            null_sentinels: ["", " "]
            transform: trim

          - access: Articulo_Cantidad
            pg: quoteItemDetail_quantity
            type: decimal

          - access: Articulo_Precio
            pg: quoteItemDetail_unitPrice
            type: decimal

          - access: Articulo_Costo
            pg: quoteItemDetail_unitCost
            type: decimal

          - access: Articulo_CostoReal
            pg: quoteItemDetail_realUnitCost
            type: decimal

          - access: Articulo_Descuento
            pg: quoteItemDetail_discount
            type: decimal

          - access: Articulo_TipoDescuento
            pg: quoteItemDetail_discountType
            type: int
            nullable: true

          - access: Articulo_PrecioLista
            pg: quoteItemDetail_listPrice
            type: decimal

          - access: Articulo_DtoMax
            pg: quoteItemDetail_maxDiscount
            type: decimal

          # Codigo 0/1 en el legacy, no booleano Jet (-1): int_bool escribe 1/0.
          - access: Articulo_PrecioControlado
            pg: quoteItemDetail_isPriceControlled
            type: int_bool

          - access: Articulo_PrecioActualizado
            pg: quoteItemDetail_isPriceUpdated
            type: access_bool

          - access: Articulo_CategoriaPlazoEntrega
            pg: quoteItemDetail_deliveryTermCategory
            type: string
            nullable: true
            null_sentinels: ["", " "]
            transform: trim

          - access: Usuario_Usr
            pg: quoteItemDetail_user
            type: string
            nullable: true
            null_sentinels: ["", " "]
            transform: trim

      # ---------------------------------------------- Otros (fuera de stock estimados)
      - entity: quoteItemOthers
        access:
          table: Otros
          pk: SubItem_Numero
          parent_fk: Item_Numero
          root_fk: Presupuesto_Numero
        postgres:
          table: quoteItemOthers
          pk: quoteItemOther_id
          parent_fk: quoteItemOther_quoteItem_id
          conflict: [quoteItemOther_quoteItem_id, quoteItemOther_lineNumber]
          delete_missing: true
        fields:
