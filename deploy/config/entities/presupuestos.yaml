# Presupuestos (Presup.mdb) <-> sales.quotes y su arbol de lineas:
#   Items -> quoteItems
#     Detalles / Otros / Reales_Detalles / Reales_Otros / Movimientos (retiros de stock)
# Mapeo tomado del ETL LFSoft-app/database/sales/etl/02_transform.sql.
#
# Access -> PG: todo el arbol. PG -> Access: el documento entero (cabecera + lineas, retiros
# incluidos) cada vez que la app lo guarda (triggers de sync V010 y V012).
# Solo se escriben las columnas mapeadas: lo que esta en Access y no en PG (nombre del
# subcliente, usuario que confecciono, etc.) queda como esta para la app legacy.
# Depende de clientes.yaml y articulos.yaml: cliente y articulo se resuelven por lookup.
#
# Numeracion: la app toma MAX(Access, PG) + 1 de este sync (use_idcoord) y reintenta +1 si
# el numero ya existe. Como la app escribe sus presupuestos en Access, el MAX+1 del VB6 los ve.
#
# Habilitada con el paquete de reset (2026-10-16): la base se recrea vacia y todos los
# presupuestos de PG salen de Access, asi que ya no hay numeros de la app que puedan chocar
# con los del VB6.
entity: quotes
enabled: true
load_order: 50

access:
  mdb: Presup.mdb
  table: Presupuestos
  pk: Presupuesto_Numero
  pk_type: long
  # Antes de 2006 el legacy no numeraba las lineas (SubItem_Numero vacio): 7.298 claves
  # repetidas en Detalles y 3.271 en Otros, todas de 1996-2005. Sin clave no hay forma de
  # emparejar esas lineas con PG, asi que esos presupuestos quedan solo en Access.
  filter: "Presupuesto_Fecha >= #1/1/2006#"

postgres:
  schema: sales
  table: quotes
  pk: quote_id
  business_key: quote_number

detection:
  access_to_pg: timestamp
  timestamp_column: Fecha_Modificado
  pg_to_access: trigger
  # El scan periodico relee todas las lineas de todos los presupuestos: espaciarlo. Los
  # scans por cambio del .mdb solo leen las lineas de los presupuestos cuya cabecera cambio;
  # una linea editada sin tocar la cabecera ni Fecha_Modificado espera al periodico.
  full_scan_interval: 2h
  change_scan_interval: 5m

fields:
  - access: Presupuesto_Numero
    pg: quote_number
    type: int

  - access: Presupuesto_Fecha
    pg: quote_date
    type: date

  - access: Presupuesto_Estado
    pg: quote_status
    type: int

  # quote_customer_id es customers.customer_id, NO el codigo legacy (ver sales V023).
  - access: Cliente_Codigo
    pg: quote_customer_id
    type: int
    lookup:
      table: sales.customers
      match: customer_legacyCode
      select: customer_id

  - access: Cliente_Codigo
    pg: quote_customerName
    type: string
    lookup:
      table: sales.customers
      match: customer_legacyCode
      select: customer_businessName

  # Codigo 0 es un destino real del legacy ("sin nombrar"), no un nulo (ver sales V022).
  - access: SubCliente_Codigo
    pg: quote_subCustomer_id
    type: int
    nullable: true

  - access: Presupuesto_Atencion
    pg: quote_attention
    type: string
    nullable: true
    null_sentinels: ["", " "]
    transform: trim

  - access: Presupuesto_Moneda
    pg: quote_currency_id
    type: int
    offset: 1

  # type int: el offset (codigo 0-based del legacy -> moneda_id) solo se aplica a enteros.
  - access: Presupuesto_Moneda
    pg: quote_currencyName
    type: int
    offset: 1
    lookup:
      table: precios.monedas
      match: moneda_id
      select: moneda_descripcion

