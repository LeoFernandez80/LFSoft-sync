          - access: Item_Moneda
            pg: quoteItemOther_currency
            type: int
            nullable: true

          - access: Item_PrecioControlado
            pg: quoteItemOther_isPriceControlled
            type: int_bool

          - access: Usuario_Usr
            pg: quoteItemOther_user
            type: string
            nullable: true
            null_sentinels: ["", " "]
            transform: trim

      # ---------------------------------------------- Reales_Detalles (articulos reales)
      - entity: quoteItemRealDetails
        access:
          table: Reales_Detalles
          pk: SubItem_Numero
          parent_fk: Item_Numero
          root_fk: Presupuesto_Numero
        postgres:
          table: quoteItemRealDetails
          pk: quoteItemRealDetail_id
          parent_fk: quoteItemRealDetail_quoteItem_id
          conflict: [quoteItemRealDetail_quoteItem_id, quoteItemRealDetail_lineNumber]
          delete_missing: true
        fields:
          - access: SubItem_Numero
            pg: quoteItemRealDetail_lineNumber
            type: int

          - access: Articulo_Codigo
            pg: quoteItemRealDetail_articleCode
            type: string
