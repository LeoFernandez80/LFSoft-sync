entity: customers
enabled: true

access:
  mdb: Clientes.mdb
  table: Clientes
  pk: Cliente_Codigo
  pk_type: long

postgres:
  schema: sales
  table: customers
  pk: customer_id
  legacy_code_column: customer_legacyCode

detection:
  access_to_pg: timestamp
  timestamp_column: Cliente_FechaActualizado
  timestamp_time_column: Cliente_HoraActualizado
  pg_to_access: trigger
  full_scan_interval: 5m

fields:
  - access: Cliente_Codigo
    pg: customer_legacyCode
    type: int

  - access: Cliente_RazonSocial
    pg: customer_businessName
    type: string
    transform: trim

  - access: Cliente_Activo
    pg: customer_isActive
    type: access_bool

  - access: Cliente_Direccion
    pg: customer_address
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_CUIT
    pg: customer_taxId
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_IDImpositivo
    pg: customer_taxIdAlternative
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Pais_Codigo
    pg: customer_country_id
    type: int
    nullable: true

  - access: Codigo_Postal
    pg: customer_postalCode
    type: string
    nullable: true
    null_sentinels: ["", "ND"]

  - access: Localidad_Codigo
    pg: customer_locality_id
    type: int
    nullable: true

  - access: Cliente_Telefono
    pg: customer_phone
    type: string
    nullable: true
    null_sentinels: ["", " "]

  - access: Cliente_Fax
    pg: customer_fax
    type: string
    nullable: true
    null_sentinels: ["", " "]

